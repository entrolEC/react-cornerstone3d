name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: '@cornerstonejs/core ${{ matrix.cornerstone }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Two points only: the peerDependencies floor and the newest 5.x.
      # Every job installs Chromium, so a third version adds half again to
      # the cost without telling us anything the two ends do not.
      matrix:
        cornerstone: ['5.1.1', '5.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve @cornerstonejs/core ${{ matrix.cornerstone }}
        id: cs
        # `npm view` returns a string for an exact version and an array for a range.
        run: |
          version=$(npm view "@cornerstonejs/core@${{ matrix.cornerstone }}" version --json \
            | jq -r 'if type == "array" then last else . end')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "@cornerstonejs/core ${{ matrix.cornerstone }} -> $version"

      - name: Install @cornerstonejs/* ${{ steps.cs.outputs.version }} over the lockfile
        # core pins metadata as an exact peer; dicom-image-loader (used by the
        # browser tests) and tools (the /tools entry) pin core exactly — so all
        # four move together.
        env:
          V: ${{ steps.cs.outputs.version }}
        run: |
          npm i --no-save \
            "@cornerstonejs/core@$V" \
            "@cornerstonejs/metadata@$V" \
            "@cornerstonejs/dicom-image-loader@$V" \
            "@cornerstonejs/tools@$V"
          # Read by path: core exports ./package.json only from 5.2.0. Fail if
          # the overwrite did not land, so a leg never tests the lockfile's core.
          node -e "const v = require('./node_modules/@cornerstonejs/core/package.json').version; console.log('installed @cornerstonejs/core', v); if (v !== process.env.V) process.exit(1)"

      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The packed output as a consumer sees it. Vite resolves leniently, so
      # the demo and the tests above cannot catch a dist that Node ESM,
      # Vitest's externalized deps or plain webpack refuse to load. publint
      # passes such a dist, so it is not the check.
      # 5.x only: CS3D 5.0/5.1 use directory imports in their own ESM, which
      # Node cannot import whatever this package does.
      - name: Import both entries under Node ESM
        if: matrix.cornerstone == '5.x'
        # Node resolves the package's own name through "exports" when run
        # inside it.
        run: node --input-type=module -e "await import('react-cornerstone3d'); await import('react-cornerstone3d/tools')"
      - name: Check the packed types resolve (attw)
        if: matrix.cornerstone == '5.x'
        run: npx --yes @arethetypeswrong/cli@0.18.5 --pack . --profile esm-only
